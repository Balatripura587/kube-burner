# test-k8s.yml
name: Execute tests on k8s
on:
  pull_request_target:
    branches:
      - master
      - main
jobs:
  fetch-latest-kind-node-tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.fetch-versions.outputs.tags }}
      kind-version: ${{ steps.fetch-versions.outputs.kind-version }}
    steps:
      - name: Fetch latest kind and latest 3 kindest/node patch versions
        id: fetch-versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # kindest/node images are built per kind release. Pinning an old kind
          # binary (e.g. v0.19.0) against current node tags breaks a matrix cell.
          # Use the GitHub API (not gh) so this also runs under act, which has no gh CLI.
          kind_version=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kubernetes-sigs/kind/releases/latest \
            | jq -r '.tag_name')
          echo "Latest kind release: ${kind_version}"
          echo "kind-version=${kind_version}" >> "$GITHUB_OUTPUT"

          # Fetch tags from Docker Hub API
          all_tags=$(curl -fsSL "https://hub.docker.com/v2/repositories/kindest/node/tags/?page_size=100" | jq -r '.results[].name')

          # Filter semantic versioning tags
          semver_tags=$(echo "$all_tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')

          # Get the latest patch versions of the latest 3 minor versions
          latest_three=$(echo "$semver_tags" | sort -V | awk -F. '{print $1"."$2}' | uniq | tail -n 3 | while read minor; do
            echo "$semver_tags" | grep "^$minor" | sort -V | tail -n 1
          done)

          echo "Latest patch versions of the latest 3 minor versions:"
          echo "$latest_three"

          # Convert the output to a JSON array for use in other steps
          tags_json=$(echo "$latest_three" | jq -c -R -s 'split("\n") | map(select(length > 0))')
          echo "tags=$tags_json" >> "$GITHUB_OUTPUT"

  test-k8s:
    needs: fetch-latest-kind-node-tags
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJson(needs.fetch-latest-kind-node-tags.outputs.tags) }}
    steps:

    - name: Checkout PR head
      uses: actions/checkout@v7
      with:
        # Use the PR head SHA
        ref: ${{ github.event.pull_request.head.sha }}
        # Fetch only the most recent commit of the PR
        fetch-depth: 1
        allow-unsafe-pr-checkout: true
        persist-credentials: false

    - name: Fetch base branch for comparison
      # This tells Git about origin/main (or master) without downloading the whole repo
      run: git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

    - name: Set up Go 1.25
      uses: actions/setup-go@v7
      with:
        go-version: "1.25"

    - name: Build code
      run: sudo make build install

    - name: Install bats
      uses: bats-core/bats-action@4.0.0
      with:
        bats-version: 1.10.0
        support-install: false
        assert-install: false
        detik-install: false
        file-install: false

    - name: Upgrade crun (actions/runner-images#14473)
      run: |
        CRUN_VERSION=1.28
        CRUN_URL=https://github.com/containers/crun/releases/download
        CRUN_URL="${CRUN_URL}/${CRUN_VERSION}"
        CRUN_SHA256=2aa6b7024a9c9f153895c0d11ae233d3758f54844011c3a039e3e89048d01d42
        curl -fsSL \
          "${CRUN_URL}/crun-${CRUN_VERSION}-linux-amd64" \
          -o /tmp/crun
        echo "${CRUN_SHA256}  /tmp/crun" | sha256sum --check
        sudo install -m 0755 /tmp/crun /usr/bin/crun
        crun --version

    - name: Execute Tests
      run: |
        make test-k8s
      env:
        TERM: linux
        GH_TOKEN: ${{ github.token }}
        KIND_VERSION: ${{ needs.fetch-latest-kind-node-tags.outputs.kind-version }}
        K8S_VERSION: ${{matrix.k8s-version}}
        PERFSCALE_PROD_ES_SERVER: ${{ secrets.PERFSCALE_PROD_ES_SERVER }}
        TEST_BINARY: /usr/bin/kube-burner
